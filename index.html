<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Absences — Synergie BTP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;
    --accent:#f97316;--accent2:#fb923c;--text:#f0f2ff;--text2:#8b90b0;
    --text3:#565b7a;--success:#22c55e;--error:#ef4444;--info:#3b82f6;
    --warn:#eab308;--radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .logo{width:38px;height:38px;background:var(--accent);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0;}
  .header-text h1{font-size:16px;font-weight:600;}
  .header-text p{font-size:12px;color:var(--text2);margin-top:1px;}

  .main{padding:20px 16px 40px;max-width:600px;margin:0 auto;}
  .section-title{font-size:11px;font-weight:600;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--text3);margin:24px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .field-label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px;display:block;}

  select,input[type="text"]{width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;
    font-size:15px;padding:12px 14px;outline:none;appearance:none;-webkit-appearance:none;
    transition:border-color 0.15s;}
  select:disabled{opacity:0.5;}
  select:focus,input[type="text"]:focus{border-color:var(--accent);}
  select option{background:#1a1d27;}
  .select-wrap{position:relative;}
  .select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;
    transform:translateY(-50%);color:var(--text2);pointer-events:none;font-size:13px;}
  .date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .date-field label{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:6px;display:block;}
  input[type="date"]{width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-sm);color:var(--text);font-family:'DM Mono',monospace;
    font-size:14px;padding:11px 12px;outline:none;appearance:none;-webkit-appearance:none;
    transition:border-color 0.15s;color-scheme:dark;}
  input[type="date"]:focus{border-color:var(--accent);}

  .error-banner{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.4);
    border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:#fca5a5;
    margin-bottom:12px;display:none;align-items:flex-start;gap:8px;line-height:1.5;}

  .btn-add{width:100%;background:var(--accent);border:none;border-radius:var(--radius-sm);
    color:white;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;
    padding:14px;cursor:pointer;margin-top:14px;transition:background 0.15s,transform 0.1s;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-add:active{transform:scale(0.98);}
  .btn-add:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed;}

  #session-list{display:flex;flex-direction:column;gap:8px;}
  .absence-item{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;
    display:flex;align-items:center;gap:10px;animation:slideIn 0.2s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .absence-item .name{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .absence-item .dates{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace;white-space:nowrap;}
  .absence-item .motif-tag{font-size:11px;color:var(--accent2);background:rgba(251,146,60,0.12);
    border-radius:4px;padding:2px 7px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;}
  .absence-item .status-tag{font-size:11px;color:#4ade80;background:rgba(34,197,94,0.12);
    border-radius:4px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
  .empty-state{text-align:center;padding:28px;color:var(--text3);font-size:14px;}
  .empty-state .icon{font-size:28px;margin-bottom:8px;}

  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px 20px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;
    z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.4);}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.success{border-color:var(--success);}
  .toast.error{border-color:var(--error);}
  .toast.info{border-color:var(--info);}

  .loader-overlay{display:none;position:fixed;inset:0;background:rgba(15,17,23,0.8);
    z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
  .loader-overlay.open{display:flex;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader-msg{font-size:14px;color:var(--text2);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="loader-overlay" id="loader">
  <div class="spinner"></div>
  <div class="loader-msg" id="loader-msg">Enregistrement…</div>
</div>

<header class="header">
  <div class="logo">SB</div>
  <div class="header-text">
    <h1>Synergie BTP</h1>
    <p>Signaler une absence</p>
  </div>
</header>

<main class="main">

  <div class="error-banner" id="error-banner">
    ❌ <div style="flex:1"><span id="error-msg">Impossible de charger la liste des salariés.</span></div>
    <button onclick="loadEmployees()" style="background:var(--error);border:none;color:white;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0;font-family:'DM Sans',sans-serif;font-weight:600;">↺ Réessayer</button>
  </div>

  <p class="section-title">Nouvelle absence</p>
  <div class="card">
    <label class="field-label">Salarié</label>
    <div class="select-wrap">
      <select id="salarie-select" disabled>
        <option value="">Chargement…</option>
      </select>
    </div>
    <div class="date-row">
      <div class="date-field"><label>Du</label><input type="date" id="date-du"></div>
      <div class="date-field"><label>Au</label><input type="date" id="date-au"></div>
    </div>
    <div style="margin-top:12px">
      <label class="field-label">Motif</label>
      <input type="text" id="motif" placeholder="Ex: Maladie, Congés, AT…">
    </div>
    <button class="btn-add" id="btn-add" onclick="addAbsence()" disabled>
      <span style="font-size:18px">+</span> Enregistrer l'absence
    </button>
  </div>

  <p class="section-title">Signalées à l'instant</p>
  <div class="card"><div id="session-list"></div></div>

</main>

<script>
// ══════════════════════════════════════════════
//  CONFIG — ne pas modifier
//  Écrit directement dans la base du portail Social : l'absence apparaît
//  aussitôt comme notification "à valider" dans le tableau de bord de
//  Morgane (Congés + Variables de paie sont mis à jour au moment où elle
//  la valide, pas avant).
// ══════════════════════════════════════════════
const SUPABASE_URL = "https://mtngptrrjxuyzyiwhuum.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bmdwdHJyanh1eXp5aXdodXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDY1NTksImV4cCI6MjEwNDI4MjU1OX0.6qtLFfeqSkvbtkTFlJZvwKpzwXs2hVlzeXMhChxMAyE";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ══════════════════════════════════════════════
//  DATES — valeur par défaut : aujourd'hui
// ══════════════════════════════════════════════
const todayStr = new Date().toISOString().split("T")[0];
const duEl = document.getElementById("date-du");
const auEl = document.getElementById("date-au");
duEl.value = auEl.value = todayStr;
duEl.addEventListener("change", function () {
  if (auEl.value < this.value) auEl.value = this.value;
  auEl.min = this.value;
});

// ══════════════════════════════════════════════
//  LISTE DES SALARIÉS ACTIFS — lue en direct depuis le portail
// ══════════════════════════════════════════════
let employees = [];

async function loadEmployees() {
  const sel = document.getElementById("salarie-select");
  const btn = document.getElementById("btn-add");
  document.getElementById("error-banner").style.display = "none";
  sel.disabled = true;
  btn.disabled = true;
  sel.innerHTML = '<option value="">Chargement…</option>';

  const { data, error } = await sb.from("public_active_employees").select("id,nom,prenom").order("nom");

  if (error || !data) {
    document.getElementById("error-banner").style.display = "flex";
    document.getElementById("error-msg").textContent =
      "Impossible de charger la liste des salariés. Vérifiez votre connexion.";
    sel.innerHTML = '<option value="">— Indisponible —</option>';
    return;
  }

  employees = data;
  sel.innerHTML =
    '<option value="">— Choisir un salarié —</option>' +
    data.map((e) => `<option value="${e.id}">${e.nom} ${e.prenom}</option>`).join("");
  sel.disabled = false;
  btn.disabled = false;
}

// ══════════════════════════════════════════════
//  ENVOI — écriture directe dans absence_reports
//  (statut "en_attente" : Morgane valide ensuite depuis le portail)
// ══════════════════════════════════════════════
let sessionList = [];

async function addAbsence() {
  const sel = document.getElementById("salarie-select");
  const employeeId = sel.value;
  const salarieNom = sel.options[sel.selectedIndex]?.text || "";
  const du = duEl.value;
  const au = auEl.value;
  const motifEl = document.getElementById("motif");
  const motif = motifEl.value.trim();

  if (!employeeId) { showToast("⚠️ Sélectionner un salarié", "error"); return; }
  if (!du || !au) { showToast("⚠️ Renseigner les dates", "error"); return; }
  if (au < du) { showToast("⚠️ Date de fin avant le début", "error"); return; }

  document.getElementById("btn-add").disabled = true;
  showLoader("Enregistrement…");

  // Important : ne PAS chaîner .select() ici — la page n'a pas le droit de
  // relire la ligne (seule Morgane, connectée, peut la lire), et demander sa
  // relecture ferait échouer l'insertion (RETURNING est soumis à la même
  // politique de sécurité que la lecture).
  const { error } = await sb.from("absence_reports").insert({
    employee_id: employeeId,
    salarie_saisi: salarieNom,
    date_debut: du,
    date_fin: au,
    motif: motif || null,
  });

  hideLoader();
  document.getElementById("btn-add").disabled = false;

  if (error) {
    showToast("❌ Erreur : " + error.message.substring(0, 60), "error");
    return;
  }

  sessionList = [{ salarie: salarieNom, du, au, motif: motif || "—" }, ...sessionList];
  renderSessionList();
  motifEl.value = "";
  sel.value = "";
  showToast("✅ Absence signalée — à valider par Morgane", "success");
}

// ══════════════════════════════════════════════
//  RENDU
// ══════════════════════════════════════════════
function fmt(d) {
  if (!d) return "—";
  const [y, m, j] = d.split("-");
  return `${j}/${m}/${y}`;
}

function renderSessionList() {
  const el = document.getElementById("session-list");
  if (!sessionList.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📋</div>Rien signalé pour l'instant dans cette session</div>`;
    return;
  }
  el.innerHTML = sessionList
    .map(
      (a) => `
    <div class="absence-item">
      <div class="name">${a.salarie}</div>
      <div class="dates">${fmt(a.du)} → ${fmt(a.au)}</div>
      <div class="motif-tag">${a.motif}</div>
      <div class="status-tag">✓ envoyé</div>
    </div>`
    )
    .join("");
}

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function showLoader(msg) {
  document.getElementById("loader-msg").textContent = msg;
  document.getElementById("loader").classList.add("open");
}
function hideLoader() {
  document.getElementById("loader").classList.remove("open");
}
function showToast(msg, type = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show " + type;
  clearTimeout(t._to);
  t._to = setTimeout(() => (t.className = "toast"), 3500);
}

renderSessionList();
loadEmployees();
</script>
</body>
</html>
